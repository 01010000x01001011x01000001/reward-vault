<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Vault</title>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .input-group { 
            margin-bottom: 15px; 
            position: relative; 
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        .pwd-container { 
            display: flex; 
            align-items: center; 
            position: relative; 
        }
        .toggle-pwd { 
            position: absolute; 
            right: 10px; 
            background: none; 
            border: none; 
            color: #aaa; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            cursor: pointer; 
        }
        button.btn { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button.btn:hover { background: #0056b3; }
        button:disabled { background: #444 !important; cursor: not-allowed !important; color: #888 !important; }
        .btn-ad { background: #28a745; margin-top: 10px; }
        .btn-ad:hover { background: #218838; }
        .logout-link { color: #ff6b6b; text-decoration: none; display: inline-block; margin-top: 10px; }
        .hp-field { display: none !important; }
    </style>
</head>
<body>

    <h2>Reward Vault</h2>

    <!-- User Header & Balance -->
    <div class="card">
        <h3>Welcome, {{ user.username }}!</h3>
        <p>Balance: $<strong><span id="user-balance">{{ "%.2f"|format(user.balance) }}</span></strong></p>
        
        <!-- Watch Ad Button -->
        <button type="button" id="ad-btn" class="btn btn-ad" onclick="startAd(event)">Watch Ad (+$0.05)</button>
        
        {% if user.id != 0 %}
            <br>
            <a href="/logout" class="logout-link">Log Out</a>
        {% endif %}
    </div>

    {% if user.id == 0 %}
    <!-- Login Form -->
    <div class="card">
        <h3>Login</h3>
        <p><small>Default Admin: <b>admin</b> / <b>admin123</b></small></p>
        <form action="/login" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="login-pwd" name="password" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('login-pwd', this)">Show</button>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" name="remember" value="true"> Remember me
            </label>

            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <!-- Register Form -->
    <div class="card">
        <h3>Create Account</h3>
        <form action="/register" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="reg-pwd" name="password" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('reg-pwd', this)">Show</button>
            </div>

            <button type="submit" class="btn">Register</button>
        </form>
    </div>
    {% endif %}

    <script>
        const MONETAG_DIRECT_LINK = "https://omg10.com/4/11485039";
        const COOLDOWN_TIME = 15; // Cooldown in seconds

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }

        function startAd(event) {
            if (event) event.preventDefault();

            // 1. BOT PROTECTION: Ensure the click was performed by an actual human user
            if (event && !event.isTrusted) {
                alert("Automated click detected.");
                return;
            }

            const adBtn = document.getElementById("ad-btn");

            // 2. ADBLOCK PROTECTION: Verify pop-up was allowed
            const adWindow = window.open(MONETAG_DIRECT_LINK, '_blank');
            if (!adWindow || adWindow.closed || typeof adWindow.closed === 'undefined') {
                alert("Ad popup was blocked! Disable your ad blocker to allow popups to earn rewards.");
                return;
            }

            // 3. AUTOCLICK PROTECTION: Disable button & start local timer immediately
            startCooldown(adBtn);

            // 4. Request backend reward
            fetch('/watch-ad', { method: 'POST' })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Error occurred'); });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('user-balance').innerText = data.new_balance;
                    }
                })
                .catch(err => {
                    alert(err.message || "Could not claim reward.");
                });
        }

        function startCooldown(button) {
            button.disabled = true;
            let timeLeft = COOLDOWN_TIME;
            button.innerText = `Wait ${timeLeft}s...`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    button.innerText = `Wait ${timeLeft}s...`;
                } else {
                    clearInterval(timer);
                    button.disabled = false;
                    button.innerText = "Watch Ad (+$0.05)";
                }
            }, 1000);
        }
    </script>
</body>
</html>
