<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Vault</title>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .input-group { 
            margin-bottom: 15px; 
            position: relative; 
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        .pwd-container { 
            display: flex; 
            align-items: center; 
            position: relative; 
        }
        .toggle-pwd { 
            position: absolute; 
            right: 10px; 
            background: none; 
            border: none; 
            color: #aaa; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            cursor: pointer; 
        }
        button.btn { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button.btn:hover { background: #0056b3; }
        button:disabled { background: #444 !important; cursor: not-allowed !important; color: #888 !important; }
        .btn-ad { background: #28a745; margin-top: 10px; }
        .btn-ad:hover { background: #218838; }
        .logout-link { color: #ff6b6b; text-decoration: none; display: inline-block; margin-top: 10px; }
        .hp-field { display: none !important; }

        .ad-modal-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .ad-modal-backdrop.open { display: flex; }
        .ad-modal {
            background: #1e1e1e;
            border-radius: 8px;
            width: 90%; max-width: 460px;
            padding: 16px;
            text-align: center;
        }
        .ad-frame-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .ad-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
        .ad-progress-track {
            width: 100%; height: 8px;
            background: #333; border-radius: 4px;
            overflow: hidden; margin-bottom: 10px;
        }
        .ad-progress-fill {
            height: 100%; width: 0%;
            background: #28a745;
            transition: width 1s linear;
        }
        .lang-switch {
            display: flex; justify-content: flex-end; margin-bottom: 10px;
        }
        .lang-switch select {
            background: #2a2a2a; color: #fff; border: 1px solid #333;
            border-radius: 4px; padding: 6px 8px; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <select id="lang-select" onchange="setLanguage(this.value)">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="es">Español</option>
        </select>
    </div>

    <h2 data-i18n="title">Reward Vault</h2>

    {% if user.id != 0 %}
    <!-- User Header & Balance (only shown once logged in) -->
    <div class="card">
        <h3><span data-i18n="welcome">Welcome,</span> {{ user.username }}!</h3>
        <p><span data-i18n="balance_label">Balance:</span> $<strong><span id="user-balance">{{ "%.2f"|format(user.balance) }}</span></strong></p>

        <!-- Watch Ad Button -->
        <button type="button" id="ad-btn" class="btn btn-ad" onclick="startAd(event)" data-i18n="watch_ad">Watch Ad (+$0.05)</button>

        <br>
        <a href="/logout" class="logout-link" data-i18n="logout">Log Out</a>
    </div>
    {% else %}
    <!-- Login Form -->
    <div class="card">
        <h3 data-i18n="login_title">Login</h3>
        <p><small data-i18n="default_admin">Default Admin: <b>admin</b> / <b>admin123</b></small></p>
        <form action="/login" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" data-i18n-placeholder="username_placeholder" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="login-pwd" name="password" data-i18n-placeholder="password_placeholder" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('login-pwd', this)" data-i18n="show">Show</button>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" name="remember" value="true"> <span data-i18n="remember_me">Remember me</span>
            </label>

            <button type="submit" class="btn" data-i18n="sign_in">Sign In</button>
        </form>
    </div>

    <!-- Register Form -->
    <div class="card">
        <h3 data-i18n="create_account">Create Account</h3>
        <form action="/register" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" data-i18n-placeholder="username_placeholder" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="reg-pwd" name="password" data-i18n-placeholder="password_placeholder" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('reg-pwd', this)" data-i18n="show">Show</button>
            </div>

            <button type="submit" class="btn" data-i18n="register">Register</button>
        </form>
    </div>
    {% endif %}

    <!-- Ad Modal: the ad plays IN the page, not a popup, so real watch time can be tracked -->
    <div class="ad-modal-backdrop" id="ad-modal-backdrop">
        <div class="ad-modal">
            <div class="ad-frame-wrap" id="ad-frame-wrap"></div>
            <div class="ad-progress-track"><div class="ad-progress-fill" id="ad-progress-fill"></div></div>
            <p id="ad-modal-status" data-i18n="watching_ad">Watching ad...</p>
        </div>
    </div>

    <script>
        const COOLDOWN_TIME = 5; // must match AD_COOLDOWN_SECONDS server-side
        const MIN_WATCH_SECONDS = 20; // must match MIN_WATCH_SECONDS server-side

        const TRANSLATIONS = {
            en: {
                title: "Reward Vault",
                welcome: "Welcome,",
                balance_label: "Balance:",
                watch_ad: "Watch Ad (+$0.05)",
                logout: "Log Out",
                login_title: "Login",
                default_admin: "Default Admin: <b>admin</b> / <b>admin123</b>",
                username_placeholder: "Username",
                password_placeholder: "Password",
                show: "Show",
                hide: "Hide",
                remember_me: "Remember me",
                sign_in: "Sign In",
                create_account: "Create Account",
                register: "Register",
                watching_ad: "Watching ad...",
                claiming_reward: "Claiming reward...",
                wait_seconds: "Wait {s}s...",
            },
            ru: {
                title: "Reward Vault",
                welcome: "Добро пожаловать,",
                balance_label: "Баланс:",
                watch_ad: "Смотреть рекламу (+$0.05)",
                logout: "Выйти",
                login_title: "Вход",
                default_admin: "Админ по умолчанию: <b>admin</b> / <b>admin123</b>",
                username_placeholder: "Имя пользователя",
                password_placeholder: "Пароль",
                show: "Показать",
                hide: "Скрыть",
                remember_me: "Запомнить меня",
                sign_in: "Войти",
                create_account: "Создать аккаунт",
                register: "Зарегистрироваться",
                watching_ad: "Просмотр рекламы...",
                claiming_reward: "Получение награды...",
                wait_seconds: "Подождите {s}с...",
            },
            es: {
                title: "Reward Vault",
                welcome: "Bienvenido,",
                balance_label: "Saldo:",
                watch_ad: "Ver anuncio (+$0.05)",
                logout: "Cerrar sesión",
                login_title: "Iniciar sesión",
                default_admin: "Admin predeterminado: <b>admin</b> / <b>admin123</b>",
                username_placeholder: "Usuario",
                password_placeholder: "Contraseña",
                show: "Mostrar",
                hide: "Ocultar",
                remember_me: "Recuérdame",
                sign_in: "Iniciar sesión",
                create_account: "Crear cuenta",
                register: "Registrarse",
                watching_ad: "Viendo anuncio...",
                claiming_reward: "Reclamando recompensa...",
                wait_seconds: "Espera {s}s...",
            },
        };

        let currentLang = "en";

        function applyLanguage(lang) {
            const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
            currentLang = lang;

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key] !== undefined) el.innerHTML = dict[key];
            });

            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (dict[key] !== undefined) el.placeholder = dict[key];
            });

            document.documentElement.lang = lang;
        }

        function setLanguage(lang) {
            try {
                localStorage.setItem("reward_vault_lang", lang);
            } catch (e) { /* storage unavailable, ignore */ }
            applyLanguage(lang);
        }

        function t(key) {
            const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
            return dict[key] !== undefined ? dict[key] : (TRANSLATIONS.en[key] || key);
        }

        (function initLanguage() {
            let saved = "en";
            try {
                saved = localStorage.getItem("reward_vault_lang") || "en";
            } catch (e) { /* storage unavailable, default to en */ }
            if (!TRANSLATIONS[saved]) saved = "en";
            document.getElementById("lang-select").value = saved;
            applyLanguage(saved);
        })();

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = t("hide");
            } else {
                input.type = "password";
                btn.textContent = t("show");
            }
        }

        let adWasVisible = true;
        let adVisibilityHandler = null;

        function startAd(event) {
            if (event) event.preventDefault();

            // BOT PROTECTION: Ensure the click was performed by an actual human user
            if (event && !event.isTrusted) {
                alert("Automated click detected.");
                return;
            }

            const adBtn = document.getElementById("ad-btn");
            adBtn.disabled = true;

            // Step 1: ask the server for permission + a one-time token for this ad impression
            fetch('/ad/start', { method: 'POST' })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Error occurred'); });
                    }
                    return response.json();
                })
                .then(data => {
                    playAd(data.token, data.min_watch_seconds || MIN_WATCH_SECONDS);
                })
                .catch(err => {
                    adBtn.disabled = false;
                    alert(err.message || "Could not start ad.");
                });
        }

        function playAd(token, minWatchSeconds) {
            const backdrop = document.getElementById("ad-modal-backdrop");
            const frameWrap = document.getElementById("ad-frame-wrap");
            const progressFill = document.getElementById("ad-progress-fill");
            const statusEl = document.getElementById("ad-modal-status");

            // TODO: replace with your real rewarded-ad network's embed/SDK call.
            // Whatever network you integrate should give you an iframe/div embed
            // and ideally its own "ad finished" callback you can combine with
            // the timer below.
            frameWrap.innerHTML = '<div style="color:#888;display:flex;align-items:center;justify-content:center;height:100%;">Ad plays here</div>';
            statusEl.textContent = t("watching_ad");

            adWasVisible = document.visibilityState === "visible";
            adVisibilityHandler = () => {
                if (document.visibilityState !== "visible") adWasVisible = false;
            };
            document.addEventListener("visibilitychange", adVisibilityHandler);

            backdrop.classList.add("open");

            let elapsed = 0;
            const timer = setInterval(() => {
                elapsed++;
                const pct = Math.min(100, (elapsed / minWatchSeconds) * 100);
                progressFill.style.width = pct + "%";

                if (elapsed >= minWatchSeconds) {
                    clearInterval(timer);
                    statusEl.textContent = t("claiming_reward");
                    finishAd(token);
                }
            }, 1000);
        }

        function finishAd(token) {
            const backdrop = document.getElementById("ad-modal-backdrop");
            const adBtn = document.getElementById("ad-btn");
            document.removeEventListener("visibilitychange", adVisibilityHandler);

            fetch('/ad/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, was_visible: adWasVisible })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Error occurred'); });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('user-balance').innerText = data.new_balance;
                    }
                })
                .catch(err => {
                    alert(err.message || "Could not claim reward.");
                })
                .finally(() => {
                    backdrop.classList.remove("open");
                    startCooldown(adBtn);
                });
        }

        function startCooldown(button) {
            button.disabled = true;
            let timeLeft = COOLDOWN_TIME;
            button.innerText = t("wait_seconds").replace("{s}", timeLeft);

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    button.innerText = t("wait_seconds").replace("{s}", timeLeft);
                } else {
                    clearInterval(timer);
                    button.disabled = false;
                    button.innerText = t("watch_ad");
                }
            }, 1000);
        }
    </script>
</body>
</html>
