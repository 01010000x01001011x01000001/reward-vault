<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward Vault</title>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .input-group { 
            margin-bottom: 15px; 
            position: relative; 
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        .pwd-container { 
            display: flex; 
            align-items: center; 
            position: relative; 
        }
        .toggle-pwd { 
            position: absolute; 
            right: 10px; 
            background: none; 
            border: none; 
            color: #aaa; 
            cursor: pointer; 
            font-size: 0.85rem; 
        }
        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 15px; 
            cursor: pointer; 
        }
        button.btn { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button.btn:hover { background: #0056b3; }
        button:disabled { background: #444 !important; cursor: not-allowed !important; color: #888 !important; }
        .btn-ad { background: #28a745; margin-top: 10px; }
        .btn-ad:hover { background: #218838; }
        .logout-link { color: #ff6b6b; text-decoration: none; display: inline-block; margin-top: 10px; }
        .hp-field { display: none !important; }

        .ad-modal-backdrop {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        .ad-modal-backdrop.open { display: flex; }
        .ad-modal {
            background: #1e1e1e;
            border-radius: 8px;
            width: 90%; max-width: 460px;
            padding: 16px;
            text-align: center;
        }
        .ad-frame-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .ad-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
        .ad-progress-track {
            width: 100%; height: 8px;
            background: #333; border-radius: 4px;
            overflow: hidden; margin-bottom: 10px;
        }
        .ad-progress-fill {
            height: 100%; width: 0%;
            background: #28a745;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <h2>Reward Vault</h2>

    {% if user.id != 0 %}
    <!-- User Header & Balance (only shown once logged in) -->
    <div class="card">
        <h3>Welcome, {{ user.username }}!</h3>
        <p>Balance: $<strong><span id="user-balance">{{ "%.2f"|format(user.balance) }}</span></strong></p>

        <!-- Watch Ad Button -->
        <button type="button" id="ad-btn" class="btn btn-ad" onclick="startAd(event)">Watch Ad (+$0.05)</button>

        <br>
        <a href="/logout" class="logout-link">Log Out</a>
    </div>
    {% else %}
    <!-- Login Form -->
    <div class="card">
        <h3>Login</h3>
        <p><small>Default Admin: <b>admin</b> / <b>admin123</b></small></p>
        <form action="/login" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="login-pwd" name="password" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('login-pwd', this)">Show</button>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" name="remember" value="true"> Remember me
            </label>

            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <!-- Register Form -->
    <div class="card">
        <h3>Create Account</h3>
        <form action="/register" method="POST">
            <!-- Bot Honeypot Field -->
            <input type="text" name="website_hp" class="hp-field" tabindex="-1" autocomplete="off">

            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group pwd-container">
                <input type="password" id="reg-pwd" name="password" placeholder="Password" required>
                <button type="button" class="toggle-pwd" onclick="togglePassword('reg-pwd', this)">Show</button>
            </div>

            <button type="submit" class="btn">Register</button>
        </form>
    </div>
    {% endif %}

    <!-- Ad Modal: the ad plays IN the page, not a popup, so real watch time can be tracked -->
    <div class="ad-modal-backdrop" id="ad-modal-backdrop">
        <div class="ad-modal">
            <div class="ad-frame-wrap" id="ad-frame-wrap"></div>
            <div class="ad-progress-track"><div class="ad-progress-fill" id="ad-progress-fill"></div></div>
            <p id="ad-modal-status">Watching ad...</p>
        </div>
    </div>

    <script>
        const COOLDOWN_TIME = 15; // must match AD_COOLDOWN_SECONDS server-side
        const MIN_WATCH_SECONDS = 20; // must match MIN_WATCH_SECONDS server-side

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }

        let adWasVisible = true;
        let adVisibilityHandler = null;

        function startAd(event) {
            if (event) event.preventDefault();

            // BOT PROTECTION: Ensure the click was performed by an actual human user
            if (event && !event.isTrusted) {
                alert("Automated click detected.");
                return;
            }

            const adBtn = document.getElementById("ad-btn");
            adBtn.disabled = true;

            // Step 1: ask the server for permission + a one-time token for this ad impression
            fetch('/ad/start', { method: 'POST' })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Error occurred'); });
                    }
                    return response.json();
                })
                .then(data => {
                    playAd(data.token, data.min_watch_seconds || MIN_WATCH_SECONDS);
                })
                .catch(err => {
                    adBtn.disabled = false;
                    alert(err.message || "Could not start ad.");
                });
        }

        function playAd(token, minWatchSeconds) {
            const backdrop = document.getElementById("ad-modal-backdrop");
            const frameWrap = document.getElementById("ad-frame-wrap");
            const progressFill = document.getElementById("ad-progress-fill");
            const statusEl = document.getElementById("ad-modal-status");

            // TODO: replace with your real rewarded-ad network's embed/SDK call.
            // Whatever network you integrate should give you an iframe/div embed
            // and ideally its own "ad finished" callback you can combine with
            // the timer below.
            frameWrap.innerHTML = '<div style="color:#888;display:flex;align-items:center;justify-content:center;height:100%;">Ad plays here</div>';

            adWasVisible = document.visibilityState === "visible";
            adVisibilityHandler = () => {
                if (document.visibilityState !== "visible") adWasVisible = false;
            };
            document.addEventListener("visibilitychange", adVisibilityHandler);

            backdrop.classList.add("open");

            let elapsed = 0;
            const timer = setInterval(() => {
                elapsed++;
                const pct = Math.min(100, (elapsed / minWatchSeconds) * 100);
                progressFill.style.width = pct + "%";

                if (elapsed >= minWatchSeconds) {
                    clearInterval(timer);
                    statusEl.textContent = "Claiming reward...";
                    finishAd(token);
                }
            }, 1000);
        }

        function finishAd(token) {
            const backdrop = document.getElementById("ad-modal-backdrop");
            const adBtn = document.getElementById("ad-btn");
            document.removeEventListener("visibilitychange", adVisibilityHandler);

            fetch('/ad/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, was_visible: adWasVisible })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.message || 'Error occurred'); });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('user-balance').innerText = data.new_balance;
                    }
                })
                .catch(err => {
                    alert(err.message || "Could not claim reward.");
                })
                .finally(() => {
                    backdrop.classList.remove("open");
                    startCooldown(adBtn);
                });
        }

        function startCooldown(button) {
            button.disabled = true;
            let timeLeft = COOLDOWN_TIME;
            button.innerText = `Wait ${timeLeft}s...`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    button.innerText = `Wait ${timeLeft}s...`;
                } else {
                    clearInterval(timer);
                    button.disabled = false;
                    button.innerText = "Watch Ad (+$0.05)";
                }
            }, 1000);
        }
    </script>
</body>
</html>
